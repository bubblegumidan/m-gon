<script>
  // Zalgo messages gradually appearing
  const messages = [
    "c̴̨̛̼̭̟̦̬̮̜̋̿̐̑̂̎̉̔̐̾̓͂̑̈́̚...",
    "''' we must go. '''",
    "''' what is that!? '''",
    "''' I-I did it, I'm free '''"
  ];

  const zalgo = document.getElementById('zalgo');
  let index = 0;

  function showMessage() {
    if(index < messages.length){
      zalgo.textContent += messages[index] + "\n\n";
      index++;
      zalgo.classList.remove('fade-text');
      void zalgo.offsetWidth; // restart fade
      zalgo.classList.add('fade-text');
      setTimeout(showMessage, 3000); // 3 seconds between messages
    }
  }

  window.onload = () => {
    showMessage();
    setInterval(() => {
      zalgo.style.textShadow = `
        0 0 ${Math.random()*5+5}px #FF00FF,
        0 0 ${Math.random()*10+10}px #FF00FF,
        0 0 ${Math.random()*15+15}px #FF00FF
      `;
    }, 100);
  };
</script>
