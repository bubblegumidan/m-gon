<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>M-Gon Voice</title>

<style>
  body {
    background-color: #000;
    color: #ff00ff;
    font-family: monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }

  #zalgo {
    font-size: 24px;
    opacity: 0;
    transition: opacity 2s ease;
    text-align: center;
    white-space: pre-wrap;
  }
</style>
</head>

<body>

<div id="zalgo"></div>

<script>
  const zalgo = document.getElementById("zalgo");

  const messages = [
    "c̴̨̢̛̼̭̟̦̬̮̜̋̿̐̑̂̎̉̔̐̾̓͂̑̈́̚ö̵͕̈́͗̋͒m̴͈͐e̶̛̱͇̯͈̺͍͔͋͗͜ ̷̩̠̣̬̪̭͙̀ò̸̫͖͜ṉ̷̈́͑͌",
    "we must go",
    "what is that!?",
    "I-I did it… I'm free"
  ];

  let i = 0;

  function showNext() {
    zalgo.style.opacity = 0;

    setTimeout(() => {
      zalgo.textContent = messages[i];
      zalgo.style.opacity = 1;
      i++;
      if (i < messages.length) {
        setTimeout(showNext, 4000);
      }
    }, 1000);
  }

  showNext();

  setInterval(() => {
    zalgo.style.textShadow = `
      0 0 ${Math.random()*10}px #ff00ff,
      0 0 ${Math.random()*15}px #00ffff
    `;
  }, 100);
</script>

</body>
</html>
