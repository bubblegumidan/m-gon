<script>
const messages = [
  "c̴̨̢̛̼̭̟̦̬̮̜̋̿̐̑̂̎̉̔̐̾̓͂̑̈́̚ö̵͕̈́͗̋͒m̴͈͐e̶̛̱͇̯͈̺͍͔͋͗͜ ̷͖̀ò̸̫͖͜ṉ̷̈́͑͌",
  "''' we must go. '''",
  "''' what is that!? '''",
  "''' I-I did it... I'm free '''"
];

let index = 0;

window.addEventListener("load", () => {
  const zalgo = document.getElementById("zalgo");
  if (!zalgo) {
    alert("Zalgo element not found");
    return;
  }

  function showMessage() {
    if (index >= messages.length) return;

    zalgo.style.opacity = 0;
    setTimeout(() => {
      zalgo.textContent += messages[index] + "\n\n";
      zalgo.style.opacity = 1;
      index++;
      setTimeout(showMessage, 3000);
    }, 500);
  }

  showMessage();
});
</script>
