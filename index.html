<script>
  // Kadomi Code Konami sequence: Up, Up, Down, Down, Left, Right, Left, Right, B, A, Enter
  const kadomiCode = [
    "ArrowUp","ArrowUp","ArrowDown","ArrowDown",
    "ArrowLeft","ArrowRight","ArrowLeft","ArrowRight",
    "b","a","Enter"
  ];

  let inputSequence = [];

  window.addEventListener("keydown", function(e){
    inputSequence.push(e.key);
    // Only keep the last N keys where N = kadomiCode length
    if(inputSequence.length > kadomiCode.length){
      inputSequence.shift();
    }

    // Check if the sequence matches
    if(inputSequence.join(",").toLowerCase() === kadomiCode.join(",").toLowerCase()){
      // Jump to manual.html Zalgo section
      window.location.href = "manual.html#zalgo";
    }
  });
</script>
